jeka.classpath=\
  dev.jeka:kotlin-plugin \
  dev.jeka:nodejs-plugin \
  dev.jeka:springboot-plugin

#Kotlin version should be >= 1.8.0 to accept allopen Kotlin compiler plugin (needed for springboot)
jeka.kotlin.version=2.1.0
# Kotlin 2.1.0 does not target Java 25. Later Kotlin versions fail to compile with JeKa 0.11.70
# (org.jetbrains.annotations.NotNull missing from the Kotlin compiler classpath).
jeka.java.version=21
jeka.kbean.default=project

## springboot config
@springboot=

## Kotlin config
@kotlin=on
@kotlin.configureProject=true
# Kotlin allopen compiler plugin, with the Spring preset
@kotlin.preset.0=SPRING

## NodeJs config
@nodeJs=
@nodeJs.version=26.13.1
@nodeJs.configureProject=true
@nodeJs.appDir=client-js
@nodeJs.buildCmd=npx yarn install, npm run build
@nodeJs.targetResourceDir=static
